name: CI

on:
  push:
    branches: [main]
  pull_request:
  # lets the release workflow reuse thee checks
  workflow_call:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Type-check
        run: pnpm check

      - name: Unit tests
        run: pnpm test

      - name: Build
        run: pnpm build

  rust:
    name: Rust
    # macOS, not Linux, to cover all code branches (#[cfg(target_os = "macos")])
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install toolchains
        run: |
          rustup component add clippy
          rustup toolchain install nightly --profile minimal --component rustfmt

      - uses: actions/cache@v4
        with:
          # Cargo registry only, target/ is too big
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Format
        run: cargo +nightly fmt --manifest-path src-tauri/Cargo.toml --check

      - name: Lint
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings

      - name: Test
        run: cargo test --manifest-path src-tauri/Cargo.toml
