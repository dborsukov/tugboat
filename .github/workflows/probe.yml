name: Probe

on:
  workflow_dispatch:

# Temporary diagnostic: proves the rustup toolchain can be installed next to the
# runner's Homebrew Rust and can cross-compile to x86_64 on an arm64 runner.
jobs:
  probe:
    runs-on: macos-latest
    steps:
      - name: Install rustup and the x64 target
        run: |
          if [ ! -x "$HOME/.cargo/bin/rustup" ]; then
            export RUSTUP_INIT_SKIP_PATH_CHECK=yes
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs \
              | sh -s -- -y --default-toolchain stable --profile minimal
          fi
          export PATH="$HOME/.cargo/bin:$PATH"

          echo "--- tools"
          command -v rustup cargo
          rustup show
          rustup target add x86_64-apple-darwin
          rustup target list --installed

          echo "--- cross build"
          cd "$(mktemp -d)"
          cargo new probe --quiet
          cd probe
          cargo build --target x86_64-apple-darwin --quiet
          file target/x86_64-apple-darwin/debug/probe
