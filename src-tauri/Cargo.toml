[package]
name = "tugboat"
version = "0.9.0"
authors = ["Denis Borsukov"]
edition = "2021"

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "tugboat_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[dependencies]
blake3 = "1.8.7"
chrono = { version = "0.4.45", features = ["serde"] }
chrono-tz = "0.10"
dirs = "6.0.0"
log = "0.4.33"
num2words = "1.2"
rust_decimal = "1.42.1"
rust_xlsxwriter = "0.92"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
specta = { version = "=2.0.0-rc.25", features = ["chrono", "rust_decimal"] }
specta-typescript = "=0.0.12"
sqlx = { version = "0.8", features = [
    "runtime-tokio",
    "sqlite",
    "macros",
    "chrono",
    "migrate",
] }
sys-locale = "0.3"
tauri = { version = "2", features = [] }
tauri-plugin-clipboard-manager = "2"
tauri-plugin-dialog = "2"
tauri-plugin-log = "2"
tauri-plugin-opener = "2"
tauri-plugin-process = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-updater = "2"
tauri-specta = { version = "=2.0.0-rc.25", features = ["derive", "typescript"] }
thiserror = "2.0.18"
tokio = { version = "1", features = ["sync"] }
typst = "0.15.1"
typst-assets = { version = "0.15.1", features = ["fonts"] }
typst-layout = "0.15.1"
typst-pdf = "0.15.1"
zip = "7"

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging"] }

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dev-dependencies]
tauri = { version = "2", features = ["test"] }
typst-render = "0.15.1"
