# (?x) flag tells regex engine to ignore whitespace and newlines
# allowing us to split the regex across multiple lines.
exclude: |
  (?x)^(
    src/lib/bindings\.ts$|
    src-tauri/icons/|
    static/
  )

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
        exclude: ^src-tauri/Cargo.toml$
      - id: end-of-file-fixer
        exclude: ^src-tauri/Cargo.toml$

  - repo: https://github.com/doublify/pre-commit-rust
    rev: v1.0
    hooks:
      - id: cargo-check
        name: cargo check
        args: ["--manifest-path=src-tauri/Cargo.toml"]
        files: ^src-tauri/
      - id: clippy
        name: cargo clippy
        args: ["--manifest-path=src-tauri/Cargo.toml", "--", "-D", "warnings"]
        files: ^src-tauri/

  - repo: local
    hooks:
      - id: cargo-fmt-nightly
        name: cargo +nightly fmt
        entry: cargo +nightly fmt --manifest-path=src-tauri/Cargo.toml
        language: system
        types: [rust]
        files: ^src-tauri/
        pass_filenames: false

      # Migrations are covered too since the schema constraint test reads the SQL.
      - id: cargo-test
        name: cargo test
        entry: cargo test --manifest-path=src-tauri/Cargo.toml
        language: system
        files: ^src-tauri/(src/|migrations/)
        pass_filenames: false

      - id: cargo-sort
        name: "cargo sort"
        entry: cargo sort src-tauri/Cargo.toml
        language: system
        files: ^src-tauri/Cargo.toml$
        pass_filenames: true

      - id: sort-package-json
        name: "sort-package-json"
        entry: npx sort-package-json
        language: system
        files: ^package\.json$
        pass_filenames: false

      - id: frontend-formatter
        name: "prettier"
        entry: npx prettier --write --log-level=warn
        language: system
        files: ^(src/.*\.([jt]sx?|svelte|css|json)|src-tauri/data/.*\.json|scripts/.*\.[cm]?js)$
        pass_filenames: true # DO NOT CHANGE THIS otherwise old migration files might reformat and their hash will change

      - id: validate-car-brands
        name: "validate car brands and logos"
        entry: node scripts/validate-car-brands.mjs
        language: system
        files: ^(src-tauri/data/car_brands(\.schema)?\.json|static/car_brand_logos/.*)$
        pass_filenames: true

      - id: svelte-typecheck
        name: "svelte-check"
        entry: npx svelte-check --tsconfig ./tsconfig.json
        language: system
        files: ^src/
        pass_filenames: false

      - id: frontend-test
        name: "vitest"
        entry: npx vitest run
        language: system
        files: ^src/
        pass_filenames: false
