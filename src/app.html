<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="%sveltekit.assets%/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Папай CRM</title>
    <!-- Pre-boot styles -->
    <style>
      html,
      body {
        background-color: #fbfaf7;
      }
      html[data-preload-mode="dark"],
      html[data-preload-mode="dark"] body {
        background-color: #191d24;
      }
      /* Keep the canvas in sync with mode-watcher after startup: the
         data-preload-mode attribute is only set once at load, while the .dark
         class tracks runtime theme changes. Without these
         rules the html background stays light after toggling light -> dark,
         which shows as a white hairline at composited layer seams (e.g. the
         sidebar boundary). */
      html.dark,
      html.dark body {
        background-color: #191d24;
      }

      /* Boot loader — the loading state that lives *inside* the window, in the
         same visual language as the splash screen (static/splashscreen.html) so
         the two read as one. macOS reveals the main window right away.
      */
      @font-face {
        font-family: "IBM Plex";
        src: url("/fonts/IBMPlexSans.ttf") format("truetype");
        font-weight: 100 900;
        font-style: normal;
        font-display: swap;
      }
      #boot-loader {
        position: fixed;
        inset: 0;
        /* Above the app chrome and any overlay (see the z-index scale in
           src/app.css): the loader owns the window until it is removed. */
        z-index: 9999;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 16px;
        font-family: "IBM Plex", "Segoe UI", system-ui, sans-serif;
        background-color: #fbfaf7;
        transition: opacity 150ms ease-out;
      }
      html[data-preload-mode="dark"] #boot-loader,
      html.dark #boot-loader {
        background-color: #191d24;
      }
      #boot-loader[data-hidden] {
        opacity: 0;
        pointer-events: none;
      }
      .boot-tile {
        width: 92px;
        height: 92px;
        border-radius: 24px;
        background: linear-gradient(145deg, #4a4380, #332d5e);
        box-shadow:
          inset 0 1px 0 rgba(255, 255, 255, 0.14),
          0 6px 18px rgba(64, 57, 110, 0.28);
        display: grid;
        place-items: center;
      }
      .boot-tile img {
        width: 62px;
        height: 62px;
        display: block;
      }
      .boot-name {
        font-size: 19px;
        font-weight: 600;
        letter-spacing: 0.01em;
        color: #191d24;
      }
      html[data-preload-mode="dark"] .boot-name,
      html.dark .boot-name {
        color: #f2f1ec;
      }
      .boot-spinner {
        width: 20px;
        height: 20px;
        border-radius: 50%;
        border: 2.5px solid rgba(249, 184, 79, 0.25);
        border-top-color: #f9b84f;
        animation: boot-spin 0.8s linear infinite;
      }
      @keyframes boot-spin {
        to {
          transform: rotate(360deg);
        }
      }
    </style>
    <script>
      (() => {
        try {
          const mode = localStorage.getItem("mode-watcher-mode") ?? "system";
          const dark =
            mode === "dark" ||
            (mode === "system" &&
              window.matchMedia("(prefers-color-scheme: dark)").matches);
          document.documentElement.dataset.preloadMode = dark
            ? "dark"
            : "light";
        } catch {}

        try {
          const boot = window.__POPEYE_BOOT__ ?? {};
          const userAgent = navigator.userAgent;
          const platform =
            boot.platform ??
            (userAgent.includes("Mac OS X")
              ? "macos"
              : userAgent.includes("Windows")
                ? "windows"
                : "linux");

          document.documentElement.dataset.platform = platform;
          document.documentElement.dataset.uiScale = String(boot.uiScale ?? 1);
        } catch {}
      })();
    </script>
    <script>
      // Keeps the packaged app from behaving like a browser: no context menu,
      // no reload, devtools or view-source shortcuts. This is a guard against
      // accidents, not a security boundary.
      (() => {
        const isBrowserShortcut = (event) => {
          if (event.key === "F5" || event.key === "F12") return true;

          const modifier = event.ctrlKey || event.metaKey;
          if (!modifier) return false;

          const key = event.key.toLowerCase();
          // Reload and view-source.
          if (key === "r" || key === "u") return true;
          // Devtools on Windows/Linux (Ctrl+Shift) and macOS (Cmd+Option).
          if (event.shiftKey && ["r", "i", "j", "c"].includes(key)) return true;
          return event.altKey && ["i", "j", "c"].includes(key);
        };

        window.addEventListener(
          "contextmenu",
          (event) => event.preventDefault(),
          { capture: true },
        );

        window.addEventListener(
          "keydown",
          (event) => {
            if (!isBrowserShortcut(event)) return;
            event.preventDefault();
            event.stopPropagation();
          },
          { capture: true },
        );
      })();
    </script>
    %sveltekit.head%
  </head>
  <body data-sveltekit-preload-data="hover">
    <div id="boot-loader">
      <div class="boot-tile">
        <img
          src="%sveltekit.assets%/popeye.svg"
          alt=""
          width="62"
          height="62"
        />
      </div>
      <div class="boot-name">Папай CRM</div>
      <div class="boot-spinner"></div>
    </div>
    <div style="display: contents">%sveltekit.body%</div>
    <script>
      if (document.documentElement.dataset.platform === "macos") {
        const appWindow = window.__TAURI__?.window?.getCurrentWindow?.();
        if (appWindow?.label === "main") {
          appWindow.show?.();
          appWindow.setFocus?.();
        }
      }
    </script>
  </body>
</html>
