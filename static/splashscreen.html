<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Tugboat</title>
    <style>
      @font-face {
        font-family: "IBM Plex";
        src: url("/fonts/IBMPlexSans.ttf") format("truetype");
        font-weight: 100 900;
        font-style: normal;
        font-display: swap;
      }

      /* Match the app backgrounds from src/app.css (light / dark) so the
         splash never flashes white and blends into the app on hand-off. */
      html,
      body {
        background-color: #fbfaf7;
      }
      html[data-preload-mode="dark"],
      html[data-preload-mode="dark"] body {
        background-color: #191d24;
      }
      /* Also follow mode-watcher's runtime .dark class, like in src/app.html */
      html.dark,
      html.dark body {
        background-color: #191d24;
      }

      body {
        margin: 0;
        user-select: none;
        -webkit-user-select: none;
        overflow: hidden;
      }

      .splash {
        height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 16px;
        font-family: "IBM Plex", "Segoe UI", system-ui, sans-serif;
      }

      .logo-tile {
        width: 140px;
        height: 140px;
        display: grid;
        place-items: center;
      }
      .logo-tile img {
        width: 140px;
        height: 140px;
        display: block;
      }

      .app-name {
        font-size: 19px;
        font-weight: 600;
        letter-spacing: 0.01em;
        color: #191d24;
      }
      html[data-preload-mode="dark"] .app-name {
        color: #f2f1ec;
      }

      .spinner {
        width: 20px;
        height: 20px;
        border-radius: 50%;
        border: 2.5px solid rgba(249, 184, 79, 0.25);
        border-top-color: #f9b84f;
        animation: spin 0.8s linear infinite;
      }
      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }

      .version {
        position: absolute;
        bottom: 14px;
        left: 0;
        right: 0;
        text-align: center;
        font-family: "IBM Plex", "Segoe UI", system-ui, sans-serif;
        font-size: 11px;
        color: #8b8a85;
      }
      html[data-preload-mode="dark"] .version {
        color: #5c6069;
      }
    </style>
    <script>
      (() => {
        try {
          const mode = localStorage.getItem("mode-watcher-mode") ?? "system";
          const dark =
            mode === "dark" ||
            (mode === "system" &&
              window.matchMedia("(prefers-color-scheme: dark)").matches);
          document.documentElement.dataset.preloadMode = dark
            ? "dark"
            : "light";
        } catch {}
      })();
    </script>
  </head>
  <body>
    <div class="splash">
      <div class="logo-tile">
        <img src="tugboat.png" alt="" width="140" height="140" />
      </div>
      <div class="app-name">Tugboat</div>
      <div class="spinner"></div>
    </div>
    <div class="version" data-version></div>
    <script>
      (() => {
        const reveal = () => {
          let shown = false;
          const show = () => {
            if (shown) return;
            shown = true;
            window.__TAURI__?.window?.getCurrentWindow()?.show?.();
          };
          // Two frames put the first paint up before the window appears, with a
          // timer as a fallback: a window that has not been shown yet is not
          // guaranteed to receive animation frames (macOS gives it none), so
          // waiting for them can mean never appearing at all.
          requestAnimationFrame(() => requestAnimationFrame(show));
          setTimeout(show, 50);
        };
        if (document.readyState === "complete") reveal();
        else window.addEventListener("load", reveal);
      })();
    </script>
    <script>
      (() => {
        const uk = (navigator.language ?? "").toLowerCase().startsWith("uk");
        const name = uk ? "Буксир" : "Tugboat";
        document.title = name;
        const label = document.querySelector(".app-name");
        if (label) label.textContent = name;
      })();
    </script>
    <script>
      window.__TAURI__?.core
        ?.invoke("get_app_version")
        .then((version) => {
          if (typeof version !== "string") return;
          const target = document.querySelector("[data-version]");
          if (target) target.textContent = `v${version}`;
        })
        .catch(() => {});
    </script>
  </body>
</html>
